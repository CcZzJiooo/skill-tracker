name: Skill Tracker quality

on:
  push:
  pull_request:

jobs:
  cross-platform-runtime:
    name: Runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate platform paths, collection, and dashboard startup
        shell: pwsh
        run: |
          ./scripts/test-platform-paths.ps1
          ./scripts/test-collector-first-run.ps1
          ./scripts/test-start-dashboard.ps1
      - name: Validate shared version metadata
        run: node scripts/test-version-contract.mjs
      - name: Validate Unix launcher
        if: runner.os != 'Windows'
        shell: bash
        run: bash ./scripts/test-unix-launcher.sh

  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell syntax and repository contracts
        shell: pwsh
        run: |
          ./collect.ps1 -ForceScan
          ./scripts/verify-collector.ps1 -SkipCollect
          ./scripts/test-run-bat-contract.ps1
          ./scripts/test-package-release.ps1
      - name: Validate v0.5.1 collector and launcher regressions
        shell: pwsh
        run: |
          ./scripts/test-collector-codex-latest-read.ps1
          ./scripts/test-collector-cache.ps1
          ./scripts/test-collector-antigravity-layout.ps1
          ./scripts/test-collector-watcher-read-retry.ps1
          ./scripts/test-start-dashboard-configured-output.ps1
      - name: Validate CLI and MCP
        shell: pwsh
        run: |
          node --check tools/skill-tracker-cli.mjs
          node --check tools/mcp-server.mjs
          node tools/skill-tracker-cli.mjs --help
      - name: Validate skill adapter schema
        shell: pwsh
        run: |
          $schema = Get-Content adapters/adapter.schema.json -Raw | ConvertFrom-Json
          if ($schema.'$id' -notmatch 'adapter.schema.json') { throw 'adapter schema id missing' }
      - name: Check changed skill metadata
        shell: pwsh
        run: ./scripts/check-skills.ps1 -Root .agents/skills
